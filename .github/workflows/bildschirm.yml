name: Bildschirmfotos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["aufwach-app/**", "test/bildschirm.sh", ".github/workflows/bildschirm.yml"]

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: aufwach-app
      - run: cp aufwach-app/app/build/outputs/apk/debug/app-debug.apk app.apk
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash test/bildschirm.sh
      - name: Fotos in den Zweig "fotos" legen
        run: |
          cd fotos && rm -f ui.xml
          git init -q -b fotos && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Bildschirmfotos"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" fotos
