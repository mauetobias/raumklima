name: Raumklima-Bote  # läuft alle 5 Minuten

on:
  schedule:
    - cron: "17 * * * *"   # nur Reserve: die Runde startet sich selbst neu
  workflow_dispatch:
    inputs:
      aktion:
        description: "Was soll der Bote tun?"
        type: choice
        default: normal
        options: [normal, roborock_code_anfordern, roborock_code_eingeben, kalender_test]
      code:
        description: "Code aus der Roborock-Mail (nur bei roborock_code_eingeben)"
        required: false

permissions:
  contents: write  # für den verschlüsselten Datenzweig „daten“
  actions: write   # nur für den Wachhalter

concurrency:
  group: bote
  cancel-in-progress: false

jobs:
  bote:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Speicher vom letzten Lauf holen
        uses: actions/cache/restore@v4
        with:
          path: |
            speicher
            token.enc
          key: speicher-${{ github.run_id }}
          restore-keys: |
            speicher-
            netatmo-

      - name: Messen und steuern, alle 5 Minuten für knapp eine Stunde
        run: bash schleife.sh
        env:
          GH_TOKEN: ${{ github.token }}
          LAUFZEIT: "3300"
          AKTION: ${{ inputs.aktion }}
          CODE: ${{ inputs.code }}
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          TOKEN_SCHLUESSEL: ${{ secrets.TOKEN_SCHLUESSEL }}
          NETHOME_EMAIL: ${{ secrets.NETHOME_EMAIL }}
          NETHOME_PASSWORT: ${{ secrets.NETHOME_PASSWORT }}
          KALENDER_ICS: ${{ secrets.KALENDER_ICS }}
          ROBOROCK_EMAIL: ${{ secrets.ROBOROCK_EMAIL }}

      - name: Nächste Runde starten
        if: always() && (inputs.aktion == '' || inputs.aktion == 'normal')
        run: gh workflow run bote.yml --ref main -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  wachhalter:
    # verhindert, dass GitHub den Zeitplan nach 60 Tagen ohne Aktivität pausiert
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bote.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
